      - name: Upload RPM Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.rpm

  build-s390x:
    name: build-s390x
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          path: ${{ env.SRC_PATH }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build s390x
        run: |
          printf '%s\n' \
            'set -ex' \
            '' \
            '# Install dependencies' \
            'apt-get update' \
            'DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              cmake \
              ninja-build \
              git \
              qtbase5-dev \
              qtscript5-dev \
              qttools5-dev \
              qttools5-dev-tools \
              libqt5svg5-dev \
              tar \
              gzip' \
            '' \
            '# Check architecture' \
            'uname -m' \
            'cmake --version' \
            '' \
            '# Configure' \
            'cd /src' \
            'ls -la' \
            'cmake -B build \
              -DCMAKE_BUILD_TYPE=Release' \
            '' \
            '# Compile' \
            'cmake --build build -j$(nproc)' \
            '' \
            '# Package' \
            'mkdir -p package' \
            'cp -a build/* package/ || true' \
            'for d in db db_extra db_custom peid_rules yara_rules; do \
            if [ -d "dep/Detect-It-Easy/$d" ]; then \
            cp -a "dep/Detect-It-Easy/$d" package/; \
            fi; \
            done' \
            'tar -czf detect-it-easy-s390x.tar.gz -C package .' \
          | docker run --rm -i \
              --platform linux/s390x \
              -v "${{ env.SRC_PATH }}:/src" \
              -w /src \
              s390x/ubuntu:24.04 \
              bash

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.SRC_PATH }}/detect-it-easy-s390x.tar.gz

  build-riscv64:
    name: build-riscv64
    runs-on: ubuntu-24.04

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Clone DIE-engine
        run: |
          git clone https://github.com/horsicq/DIE-engine.git \
            --recursive \
            ${{ env.SRC_PATH }}

      - name: Build riscv64
        run: |
          printf '%s\n' \
            'set -ex' \
            '' \
            '# Install dependencies' \
            'apt-get update' \
            'DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              cmake \
              ninja-build \
              git \
              qtbase5-dev \
              qtscript5-dev \
              qttools5-dev \
              qttools5-dev-tools \
              libqt5svg5-dev \
              tar \
              gzip' \
            '' \
            '# Check architecture' \
            'uname -m' \
            'cmake --version' \
            '' \
            '# Configure' \
            'cd /src' \
            'cmake -B build \
              -DCMAKE_BUILD_TYPE=Release' \
            '' \
            '# Compile' \
            'cmake --build build -j$(nproc)' \
            '' \
            '# Package' \
            'mkdir -p package' \
            'cp -a build/* package/ || true' \
            'for d in db db_extra db_custom peid_rules yara_rules; do \
                if [ -d "dep/Detect-It-Easy/$d" ]; then \
                  cp -a "dep/Detect-It-Easy/$d" package/; \
                fi; \
             done' \
            'tar -czf detect-it-easy-riscv64.tar.gz -C package .' \
          | docker run --rm -i \
              --platform linux/riscv64 \
              -v "${{ env.SRC_PATH }}:/src" \
              -w /src \
              riscv64/ubuntu:24.04 \
              bash

      - name: Upload Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.SRC_PATH }}/detect-it-easy-riscv64.tar.gz

  build-nix:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DIE-engine
        run: |
          git clone --recursive \
            https://github.com/horsicq/DIE-engine.git

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_conf: |
            experimental-features = nix-command flakes

      - name: Build with Nix
        run: |
          nix-build DIE-engine/build.nix -o result

      - name: Create Nix Release
        run: |
          mkdir -p release
          nix-store --export $(nix-store -qR result) | xz -T0 > release/detect-it-easy-4.0.0-nix-closure.nar.xz

      - name: Upload Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.nar.xz

  build-freebsd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Build DiE for FreeBSD
        uses: cross-platform-actions/action@v0.25.0
        with:
          operating_system: freebsd
          version: '14.0'
          run: |
            sudo env IGNORE_OSVERSION=yes pkg update
            sudo env IGNORE_OSVERSION=yes pkg install -y git cmake qt5 qt5-script qt5-svg qt5-linguisttools pkgconf bash
            
            export PATH=$PATH:/usr/local/lib/qt5/bin
            
            mkdir build
            cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
            cmake --build . --config Release -j $(sysctl -n hw.ncpu)
            
            DESTDIR=$(pwd)/../stage cmake --install .
            cd ..
            
            mkdir -p stage/usr/local/bin
            find build -type f -name "die" -exec cp -f {} stage/usr/local/bin/ \; || true
            find build -type f -name "diec" -exec cp -f {} stage/usr/local/bin/ \; || true
            
            if [ -z "$(ls -A stage/usr/local/bin)" ]; then exit 1; fi
            
            mkdir -p release
            find stage -type f | sed 's/^stage//' > plist
            pkg create -M manifest.ucl -p plist -r stage -o release

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: release/*.pkg
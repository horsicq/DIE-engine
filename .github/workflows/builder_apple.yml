name: Build DIE-engine for Apple

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to receive the macOS packages
        required: false
        type: string
        default: Beta
      release_draft:
        description: Keep the release unpublished while packages are built
        required: false
        type: boolean
        default: false
      release_prerelease:
        description: Mark the release as a prerelease
        required: false
        type: boolean
        default: true
      require_signing:
        description: Require signing credentials; unsigned builds never upload to releases
        required: false
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE_P12_BASE64:
        description: Base64 Developer ID Application certificate and private key (.p12)
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: Password protecting the .p12 file
        required: false
      APPLE_NOTARY_KEY_P8:
        description: App Store Connect Team API private key (.p8 contents)
        required: false
      APPLE_NOTARY_KEY_ID:
        description: API key ID (may instead be configured as a repository variable)
        required: false
      APPLE_NOTARY_ISSUER_ID:
        description: API issuer ID (may instead be configured as a repository variable)
        required: false
      APPLE_NOTARY_APPLE_ID:
        description: Apple ID for notarization instead of an App Store Connect API key
        required: false
      APPLE_NOTARY_PASSWORD:
        description: App-specific password for Apple-ID notarization
        required: false
      APPLE_NOTARY_TEAM_ID:
        description: Developer Team ID for Apple-ID notarization
        required: false
      APPLE_SIGNING_IDENTITY:
        description: Optional Developer ID Application name or SHA-1 fingerprint
        required: false
  workflow_dispatch:
    inputs:
      require_signing:
        description: Require a signed and notarized build
        required: false
        type: boolean
        default: false
  release:
    types: [created]
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }}, Qt ${{ matrix.qt_major }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            qt_major: 5
            qt_version: '5.15.2'
            qt_modules: qtscript
          - runner: macos-15-intel
            arch: x86_64
            qt_major: 6
            qt_version: '6.12.0'
            qt_modules: qt5compat
          - runner: macos-15
            arch: arm64
            qt_major: 6
            qt_version: '6.12.0'
            qt_modules: qt5compat
    env:
      CMAKE_OSX_ARCHITECTURES: ${{ matrix.arch }}
      QT_MAJOR: ${{ matrix.qt_major }}
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check signing configuration
        id: signing_config
        if: github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID || vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID || vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID || vars.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID || vars.APPLE_NOTARY_TEAM_ID }}
          REQUIRE_SIGNING: ${{ inputs.require_signing || inputs.release_draft || github.event_name == 'release' || (inputs.release_tag && inputs.release_tag != 'Beta') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUIRE_SIGNING" == 'true' ]]; then
            python3 .github/scripts/sign_macos.py check
          else
            python3 .github/scripts/sign_macos.py check --allow-unsigned
          fi

      - name: Restore notarization IDs from previous attempts
        id: notary_restore
        if: steps.signing_config.outputs.enabled == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/notary_ci_state.py restore

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ matrix.qt_modules }}
          cache: true

      - name: Build portable ZIP and disk image
        shell: bash
        run: |
          set -euo pipefail
          bash build_mac.sh "$QT_ROOT_DIR"

      - name: Name and verify packages
        id: package
        shell: bash
        env:
          QT_MAJOR: ${{ matrix.qt_major }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < release_version.txt)
          archive="release/die_${version}_mac_portable_${CMAKE_OSX_ARCHITECTURES}_qt${QT_MAJOR}.zip"
          disk_image="release/die_${version}_mac_${CMAKE_OSX_ARCHITECTURES}_qt${QT_MAJOR}.dmg"
          mv "release/die_${version}_mac_portable.zip" "$archive"
          mv "release/die_${version}_mac.dmg" "$disk_image"
          test -s "$archive"
          test -s "$disk_image"

          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          ditto -x -k "$archive" "$verify_dir"
          bundle=$(find "$verify_dir/die_mac_portable" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$bundle"
          for executable in die diec; do
            binary="$bundle/Contents/MacOS/$executable"
            test -x "$binary"
            test "$(lipo -archs "$binary")" = "$CMAKE_OSX_ARCHITECTURES"
          done
          env -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH \
            "$bundle/Contents/MacOS/diec" --version
          printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'disk_image_path=%s\n' "$disk_image" >> "$GITHUB_OUTPUT"

      # Apple's ticket service can lose connections on both Intel and ARM64.
      # Force TCP using the workaround from actions/runner-images#14924.
      # Keep the workaround in its own PF anchor and release it after signing.
      - name: Use TCP for Apple ticket retrieval
        id: stapler_network
        if: steps.signing_config.outputs.enabled == 'true'
        timeout-minutes: 2
        run: python3 .github/scripts/stapler_network.py enable

      # PRs and standalone runs without signing credentials produce unsigned
      # artifacts. Every package uploaded to a release must
      # have a Developer ID signature and a stapled Apple notarization ticket.
      - name: Sign and notarize packages
        id: signing
        if: steps.signing_config.outputs.enabled == 'true'
        timeout-minutes: 75
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID || vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID || vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID || vars.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID || vars.APPLE_NOTARY_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || vars.APPLE_SIGNING_IDENTITY }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          DISK_IMAGE_PATH: ${{ steps.package.outputs.disk_image_path }}
        run: python3 .github/scripts/sign_macos.py sign "$PACKAGE_PATH" "$DISK_IMAGE_PATH"

      - name: Remove temporary signing credentials
        if: always() && steps.signing_config.outputs.enabled == 'true'
        timeout-minutes: 3
        run: python3 .github/scripts/sign_macos.py cleanup

      - name: Restore Apple ticket retrieval network settings
        if: always() && steps.signing_config.outputs.enabled == 'true'
        timeout-minutes: 2
        run: python3 .github/scripts/stapler_network.py cleanup

      # Keep a small state artifact separate from process reports. Each attempt
      # retains earlier hashes as well as this attempt's app/disk image IDs.
      - name: Save notarization IDs for reruns
        id: notary_save
        if: always() && steps.notary_restore.outcome == 'success'
        timeout-minutes: 2
        run: python3 .github/scripts/notary_ci_state.py save

      - name: Upload notarization IDs for reruns
        if: always() && steps.notary_save.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: die-macos-notary-state-${{ matrix.arch }}-qt${{ matrix.qt_major }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/die-apple-notary-state/
          if-no-files-found: error

      - name: Upload notarization diagnostics
        if: always() && steps.signing_config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: die-macos-notarization-${{ matrix.arch }}-qt${{ matrix.qt_major }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/die-apple-notarization/**/*.json
            ${{ runner.temp }}/die-apple-notarization/**/*.txt
          if-no-files-found: ignore

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: die-macos-${{ matrix.arch }}-qt${{ matrix.qt_major }}-${{ steps.signing.outcome == 'success' && 'signed' || 'unsigned' }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.disk_image_path }}
          if-no-files-found: error

      # Signed standalone runs append packages to the published Beta prerelease,
      # matching builder.yml. make_release.yml supplies a versioned draft tag.
      - name: Upload Release as Download
        if: github.event_name != 'pull_request' && steps.signing.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || 'Beta' }}
          draft: ${{ inputs.release_draft || false }}
          prerelease: ${{ !inputs.release_tag || inputs.release_prerelease }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.disk_image_path }}
